name: Build Web

# Requer o secret UNITY_LICENSE (ou UNITY_SERIAL) configurado no repositório.
# Sem ele, o job para logo no início com uma mensagem explicando o que fazer,
# em vez de falhar lá dentro do Unity com um erro críptico.
#
# Se você ainda não configurou a licença e só quer publicar no Pages agora,
# use o workflow "Deploy Pages (build manual)" — ele não precisa de Unity.
# Ver README, seção "Deploy".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Evita que dois deploys simultâneos briguem pelo ambiente do Pages.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest

    steps:
      # Preflight: transforma "Missing Unity License File and no Serial was found"
      # numa mensagem que diz o que fazer.
      - name: Verificar credenciais Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error title=Licenca Unity ausente::Nenhum UNITY_LICENSE ou UNITY_SERIAL configurado."
            echo ""
            echo "COMO RESOLVER (licenca Personal, gratuita):"
            echo "  1. Rode o workflow 'Acquire Unity Activation File' (activation.yml)"
            echo "     na aba Actions deste repositorio."
            echo "  2. Baixe o artefato .alf gerado."
            echo "  3. Envie o .alf em https://license.unity3d.com/manual"
            echo "     e baixe o arquivo .ulf de resposta."
            echo "  4. Abra o .ulf num editor de texto, copie TODO o conteudo."
            echo "  5. Cole em Settings > Secrets and variables > Actions >"
            echo "     New repository secret, com o nome UNITY_LICENSE."
            echo "  6. Adicione tambem UNITY_EMAIL e UNITY_PASSWORD da sua conta Unity."
            echo ""
            echo "Para licenca Pro: configure UNITY_SERIAL no lugar de UNITY_LICENSE."
            echo ""
            echo "ALTERNATIVA SEM LICENCA: use o workflow 'Deploy Pages (build manual)'."
            exit 1
          fi

          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning::UNITY_EMAIL/UNITY_PASSWORD ausentes. A ativacao Personal costuma exigir os dois."
          fi

          echo "Credenciais presentes. Prosseguindo."

      # 1. checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache da pasta Library: sem isso cada build reimporta o projeto inteiro
      # (vários minutos a mais por execução).
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # 2. Unity + 3. Build Web
      # buildMethod aponta para o mesmo BuildScript usado localmente, então CI e
      # máquina local produzem exatamente o mesmo artefato (compressão, stripping etc).
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: BuildScript.BuildWebGL
          allowDirtyBuild: true

      # O GitHub Pages roda Jekyll por padrão, que ignora arquivos/pastas iniciados
      # por "_" e pode reprocessar o HTML. .nojekyll desliga isso.
      - name: Preparar para GitHub Pages
        run: |
          test -f Builds/WebGL/index.html || { echo "::error::Build nao gerou index.html em Builds/WebGL"; exit 1; }
          touch Builds/WebGL/.nojekyll
          echo "Conteudo do build:"
          ls -la Builds/WebGL
          du -sh Builds/WebGL

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL

  # 4. Deploy — só na branch principal e só se o build passou.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Criar o site do Pages pela primeira vez via API é uma operacao restrita
      # que o GITHUB_TOKEN do workflow nao tem permissao para fazer (mesmo com
      # pages:write) -- so funciona feita manualmente pelo dono do repo, uma
      # unica vez, pelo navegador. Sem esse preflight, configure-pages falha
      # la na frente com "Resource not accessible by integration", que nao diz
      # o que fazer.
      - name: Verificar se o Pages ja foi habilitado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$status" = "404" ]; then
            echo "::error title=GitHub Pages nao habilitado::O site do Pages ainda nao existe neste repositorio."
            echo ""
            echo "Isto e configuracao manual, feita uma unica vez pelo dono do repo:"
            echo "  1. Va em Settings > Pages"
            echo "  2. Em 'Build and deployment', Source: selecione 'GitHub Actions'"
            echo "  3. Rode este workflow de novo"
            echo ""
            echo "Criar o site via API (o que este workflow tentaria a seguir) e"
            echo "uma operacao restrita que o token do workflow nao tem permissao"
            echo "para fazer -- por isso precisa ser feito pela interface."
            exit 1
          fi

      # enablement: true confirma o site ja existente (o preflight acima ja
      # garantiu isso) -- nao tenta mais criar do zero.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
