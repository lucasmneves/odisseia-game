<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!--
      Template do Odisseia (QA-07 e QA-18). O template padrão do Unity fixava o canvas em 960 × 600 px no desktop:
      janela menor cortava o jogo, maior não aproveitava a tela. Aqui o canvas ocupa a MAIOR área 16:9 que cabe na
      janela (faixas pretas no que sobra) e acompanha o redimensionamento — 16:9 porque os cenários foram compostos
      nessa proporção. O Unity casa a resolução de render com o tamanho do canvas (matchWebGLToCanvasSize).
    -->
    <script>
      // Teste e QA: ?mudo=1 na URL deixa o jogo sem som desde o primeiro quadro — todo AudioContext nasce suspenso e
      // não pode ser retomado (nem por clique). Sem o parâmetro, nada muda para o jogador.
      if (/[?&](mudo|mute)=1(&|$)/.test(location.search)) {
        (function () {
          var Base = window.AudioContext || window.webkitAudioContext;
          if (!Base) { return; }
          Base.prototype.resume = function () { return Promise.resolve(); };
          var Mudo = function () { var c = new (Function.prototype.bind.apply(Base, [null].concat([].slice.call(arguments))))(); c.suspend(); return c; };
          Mudo.prototype = Base.prototype;
          window.AudioContext = window.webkitAudioContext = Mudo;
        })();
      }
    </script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #0b0e14; outline: none; }
      #loading {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; color: #e9e2cf; font: 18px/1.3 "Trebuchet MS", Arial, sans-serif; letter-spacing: 0.04em;
      }
      #bar { width: min(320px, 60vw); height: 10px; border: 2px solid #e9e2cf; padding: 2px; box-sizing: content-box; }
      #bar-fill { width: 0; height: 100%; background: #d9a441; }
      #fullscreen {
        position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border: 0; border-radius: 6px;
        background: rgba(0, 0, 0, 0.45); color: #e9e2cf; font-size: 18px; cursor: pointer; display: none;
      }
      #fullscreen:hover { background: rgba(0, 0, 0, 0.7); }
      #warning { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); max-width: 90%; display: none; }
      #warning div { padding: 8px 12px; margin-bottom: 6px; font: 14px Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><span id="loading-text">Carregando…</span><div id="bar"><div id="bar-fill"></div></div></div>
      <button id="fullscreen" title="Tela cheia" aria-label="Tela cheia">⛶</button>
      <div id="warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (!/^pt/i.test(navigator.language || "")) {
        document.querySelector("#loading-text").textContent = "Loading…";
        document.querySelector("#fullscreen").title = "Fullscreen";
      }

      // Maior retângulo 16:9 que cabe na janela. No celular, a tela inteira (como o template padrão fazia) —
      // o jogo trata retrato com o aviso de girar o aparelho.
      function ajustar() {
        var w = window.innerWidth, h = window.innerHeight;
        if (!mobile) {
          if (w / h > 16 / 9) { w = Math.round(h * 16 / 9); } else { h = Math.round(w * 9 / 16); }
        }
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      window.addEventListener("resize", ajustar);
      ajustar();

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#warning");
        var div = document.createElement("div");
        div.textContent = msg;
        div.style.background = type == "error" ? "#b3261e" : "#e0b100";
        div.style.color = type == "error" ? "#fff" : "#000";
        banner.appendChild(div);
        banner.style.display = "block";
        if (type != "error") {
          setTimeout(function () {
            banner.removeChild(div);
            banner.style.display = banner.children.length ? "block" : "none";
          }, 5000);
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // QA-18: o save (PlayerPrefs) é persistido pelo próprio motor, sem a sincronização manual
        // JS_FileSystem_Sync() que o console acusava como depreciada.
        autoSyncPersistentDataPath: true,
      };

      if (mobile) {
        document.querySelector("#unity-container").className = "unity-mobile";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-fill").style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          document.querySelector("#loading").style.display = "none";
          var botao = document.querySelector("#fullscreen");
          // No celular o jogo já ocupa a tela inteira, e este canto é dos controles de toque: o botão cobria o ATK.
          botao.style.display = mobile ? "none" : "block";
          botao.onclick = function () { unityInstance.SetFullscreen(1); canvas.focus(); };
          canvas.focus();
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
